<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mini browser</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --box: #fff; --text: #1d1d1f; --muted: #86868b; --ring: #0071e3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --box: #2c2c2e; --text: #f5f5f7; --muted: #98989d; --ring: #0a84ff; } }
  html, body { height: 100%; margin: 0; background: var(--bg); font: 15px -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); }
  body { display: flex; align-items: flex-start; justify-content: center; }
  form { width: min(560px, calc(100% - 32px)); margin-top: 18vh; }
  input { box-sizing: border-box; width: 100%; padding: 14px 16px; font: inherit; font-size: 18px; color: var(--text);
          background: var(--box); border: 0; border-radius: 12px; outline: none;
          box-shadow: 0 8px 30px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.06); }
  input:focus { box-shadow: 0 8px 30px rgba(0,0,0,.12), 0 0 0 2px var(--ring); }
  p { margin: 10px 4px 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<form>
  <input name="q" autofocus autocomplete="off" spellcheck="false" placeholder="Search or enter URL…" aria-label="Search or enter URL">
  <p>Enter to go · Esc to close</p>
</form>
<script src="mini-browser-page.js"></script>
</body>
</html>
