# The Mac app. `make project` turns this into Monochrome.xcodeproj (not committed); the Makefile has the
# build, install and release targets. The extension at the repository root is not built by Xcode: the
# app's run script copies it into the app for the Extension tab's Load unpacked, and the Safari
# extension target's run script copies it into the app extension Safari loads (docs/safari.md).
name: Monochrome
options:
  bundleIdPrefix: com.artifact
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  fileTypes:
    icon:
      file: true
      buildPhase: resources
settings:
  base:
    DEVELOPMENT_TEAM: TVA9Z8LD95
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Sparkle's updater and XPC services need it, and so does notarization.
    ENABLE_HARDENED_RUNTIME: YES
    # The version lives here, not in the plist; `make release VERSION=x.y` rewrites both numbers and the
    # extension manifest's. Sparkle compares CFBundleVersion, so it is the version too.
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1.3"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Monochrome:
    type: application
    platform: macOS
    sources:
      - path: helper
        excludes: ["*.sh", "Info.plist", "build"]
      # Chrome runs this as the native messaging host (a host manifest can name a program but not its
      # arguments); it execs the app's binary with --host.
      - path: helper/host.sh
        buildPhase: resources
      - path: helper/install-drag-icon.png
        buildPhase: resources
    dependencies:
      - package: Sparkle
      # Embedded in Contents/PlugIns: what Safari lists as the Monochrome extension.
      - target: MonochromeSafari
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artifact.monochrome
        PRODUCT_NAME: Monochrome
        ASSETCATALOG_COMPILER_APPICON_NAME: Monochrome
        # The app group whose container holds the Safari relay's socket (SafariSocket in Bridge.swift).
        CODE_SIGN_ENTITLEMENTS: helper/Monochrome.entitlements
    info:
      path: helper/Info.plist
      properties:
        CFBundleDisplayName: Monochrome
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: Monochrome
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # No Dock tile or menu bar until the settings window opens.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        # The default-browser role: links from other apps arrive here and go to the extension.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web page
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html, public.xhtml]
        # Sparkle: the appcast on main, and the public half of the EdDSA key in the releasing Mac's keychain.
        SUFeedURL: https://raw.githubusercontent.com/arfct/monochrome/main/appcast.xml
        SUPublicEDKey: 8KsAc6N3KqGJDXEUdTEnpkpDsadF5kqwph6Qonhpu8o=
        SUEnableAutomaticChecks: true
    postBuildScripts:
      - name: Extension and host
        basedOnDependencyAnalysis: false
        # Declared so the files this script writes count as the target's output: without it an
        # incremental build copies changed extension files and skips re-signing, breaking the seal.
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/extension-ids.json
        script: |
          # The extension's files (store/files, the list pack.sh zips) into Resources/extension, manifest
          # key included, for the Extension tab's Load unpacked; host.sh executable; and the extension
          # IDs the app registers its host for, as Resources/extension-ids.json: the unpacked one is the
          # first 32 hex digits of the SHA-256 of the manifest's key written with a-p for 0-f, the Web
          # Store's is store/id. (A file, not an Info.plist key: Xcode processes the plist on its own
          # schedule, which can come after this script.)
          set -eu
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          extension="$resources/extension"
          rm -rf "$extension"
          mkdir -p "$extension/icons"
          # Each file's folder first: the reader's files are in subfolders (tldr/core, tldr/vendor).
          while read -r f; do mkdir -p "$(dirname "$extension/$f")"; cp "$SRCROOT/$f" "$extension/$f"; done < "$SRCROOT/store/files"
          chmod +x "$resources/host.sh"
          python3 -I - "$SRCROOT" "$resources/extension-ids.json" <<'PY'
          import base64, hashlib, json, os, sys
          root, out = sys.argv[1:]
          key = base64.b64decode(json.load(open(os.path.join(root, 'manifest.json')))['key'])
          ids = [''.join(chr(97 + int(c, 16)) for c in hashlib.sha256(key).hexdigest()[:32])]
          store = os.path.join(root, 'store/id')
          if os.path.exists(store):
              ids.append(open(store).read().strip())
          json.dump(list(dict.fromkeys(i for i in ids if i)), open(out, 'w'))
          PY

  # The Safari Web Extension: the same extension files with a Safari manifest (store/safari-manifest.py),
  # and SafariWebExtensionHandler, which relays the extension's native messages to the running app. An
  # app extension must be sandboxed; the app group gives it and the app one folder to meet in.
  MonochromeSafari:
    type: app-extension
    platform: macOS
    sources:
      - path: safari
        excludes: ["Info.plist", "*.entitlements"]
      - path: helper/Bridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artifact.monochrome.extension
        PRODUCT_NAME: Monochrome Extension
        CODE_SIGN_ENTITLEMENTS: safari/Extension.entitlements
        SKIP_INSTALL: YES
    info:
      path: safari/Info.plist
      properties:
        CFBundleDisplayName: Monochrome
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableDescription: Locked tabs, new tabs at the top, a ⌃Tab switcher with thumbnails, mini and peek browsers, and link routing for Safari.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    postBuildScripts:
      - name: Extension files
        basedOnDependencyAnalysis: false
        # As above: declared so an incremental build re-signs the app extension after copying.
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/manifest.json
        script: |
          # The files store/files lists, into the app extension's Resources, where Safari reads the
          # extension; manifest.json is the Safari one, written from the Chrome manifest.
          set -eu
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$resources/icons"
          grep -v '^manifest.json$' "$SRCROOT/store/files" | while read -r f; do mkdir -p "$(dirname "$resources/$f")"; cp "$SRCROOT/$f" "$resources/$f"; done
          python3 -I "$SRCROOT/store/safari-manifest.py" "$SRCROOT/manifest.json" "$resources/manifest.json"
